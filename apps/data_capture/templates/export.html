{% extends "base.html" %}
{% block content %}<section class="hero compact"><p class="eyebrow">Latest active versions by default</p><h1>Accounting export</h1></section><form class="panel field-grid" method="get"><label>Branch<select name="branch" required>{% for branch in branches %}<option>{{ branch }}</option>{% endfor %}</select></label><label>Start date<input type="date" name="start" required></label><label>End date<input type="date" name="end" value="{{ today }}" required></label><label>Format<select name="format"><option value="xlsx">XLSX workbook</option><option value="csv">CSV files (ZIP)</option></select></label><label class="checkbox wide"><input type="checkbox" name="include_history" value="1"> Include version history</label><button type="submit">Create logged export</button></form>{% endblock %}
